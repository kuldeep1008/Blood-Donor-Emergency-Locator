# Name of the application
spring.application.name=blood-donor-locator

# Server port
server.port=8080

# MongoDB connection
# If MongoDB is running locally with default settings, this works as-is.
# If you use MongoDB Atlas (cloud, free tier), replace this with your connection string, e.g.:
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.mongodb.net/blooddonor
spring.data.mongodb.uri=mongodb://localhost:27017/blooddonor

# Email (used to alert matching donors) - using Gmail's free SMTP server.
# IMPORTANT: You cannot use your normal Gmail password here - Google blocks that.
# You must generate a 16-character "App Password" instead. Steps:
#   1. Go to https://myaccount.google.com/security
#   2. Turn on 2-Step Verification (if not already on)
#   3. Search "App Passwords" in the search bar at the top of that page
#   4. Create one (name it e.g. "PulseApp"), copy the 16-character password
#   5. Paste it below instead of your real password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=email@gmail.com
spring.mail.password=******
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
